
name: Sync Armory character

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynasty-armory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Armory data
        env:
          DYNASTY_CHARACTER: lXlGhostlXl
        run: python dynasty-tracker-github-pages/scripts/sync.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dynasty-tracker-github-pages/data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Armory snapshot"
            git push
          fi
